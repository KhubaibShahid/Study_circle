name: study_circle
description: StudyCircle — your self-made university. Roadmaps, classmates, alarms, exams and an AI tutor.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  flutter_local_notifications: ^19.2.1
  timezone: ^0.10.1
  http: ^1.2.2
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
