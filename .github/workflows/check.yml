name: Check

on:
  workflow_dispatch: {}
  push:
    branches: [dev]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --org com.khubaib --project-name study_circle --platforms android .
      - run: flutter pub get
      - name: Analyze (errors fail the check)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
