name: Build APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --org com.khubaib --project-name study_circle --platforms android .

      - name: Get packages
        run: flutter pub get

      - name: Add Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi
          if [ ! -f android/app/google-services.json ]; then
            echo "::error::android/app/google-services.json is missing."
            exit 1
          fi

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Patch Android (alarms, desugaring, Firebase plugin)
        run: dart run tool/patch_android.dart

      - name: Build APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/StudyCircle.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StudyCircle-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: StudyCircle v1.0.${{ github.run_number }}
          body: Install StudyCircle.apk on your Android phone (allow "Install unknown apps").
          files: build/app/outputs/flutter-apk/StudyCircle.apk
